<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-<!--SCRIPT_HASH-->'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>邮件简报 · 阅读版</title>
  <style>
    :root{color-scheme:light dark}
    body{margin:0;padding:12px;background:light-dark(#eef2f8,#10151e)}
    main{max-width:760px;margin:0 auto}
    @media(max-width:520px){body{padding:0}#mail-reading-preview{border-radius:0}}
    @media print{body{padding:0;background:white}.mp-toolbar,.mp-nav{display:none!important}}
  </style>
</head>
<body><main><div id="mail-reading-preview" aria-label="邮件简报阅读版"><style>
    #mail-reading-preview{--mp-page:light-dark(#f2f5fb,#10151e);--mp-paper:light-dark(#fff,#181f2a);--mp-ink:light-dark(#24334c,#e4ebf5);--mp-muted:light-dark(#64748b,#a4b2c8);--mp-line:light-dark(#dfe6ef,#344154);--mp-blue:light-dark(#235ac7,#9abfff);--mp-purple:light-dark(#7940bd,#c6a4fa);--mp-teal:light-dark(#087c72,#7ad5c8);--mp-gold:light-dark(#966300,#f4cb76);--mp-red:light-dark(#ad3d4c,#ffadba);--mp-font:18px;--mp-gap:24px;--mp-radius:16px;box-sizing:border-box;width:100%;color:var(--mp-ink);background:var(--mp-paper);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:var(--mp-font);line-height:1.75;padding:28px 32px 34px;border-top:5px solid var(--mp-blue);border-radius:var(--mp-radius);color-scheme:inherit;overflow-wrap:anywhere}
    #mail-reading-preview *{box-sizing:border-box}
    #mail-reading-preview [hidden]{display:none!important}
    #mail-reading-preview h1,#mail-reading-preview h2,#mail-reading-preview h3,#mail-reading-preview p{margin:0}
    #mail-reading-preview h1{font-size:calc(var(--mp-font)*1.55);font-weight:500;letter-spacing:.01em;line-height:1.4;margin:10px 0}
    #mail-reading-preview h2{font-size:calc(var(--mp-font)*1.18);font-weight:500;line-height:1.5;display:flex;align-items:center;gap:10px}
    #mail-reading-preview h3{font-size:var(--mp-font);line-height:1.6;font-weight:500}
    #mail-reading-preview .mp-topline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:space-between;padding-right:76px}
    #mail-reading-preview .mp-wordmark{font-size:12px;letter-spacing:.15em;color:var(--mp-blue);font-weight:500}
    #mail-reading-preview .mp-sample{font-size:12px;color:var(--mp-muted)}
    #mail-reading-preview .mp-subtitle{font-size:14px;color:var(--mp-muted)}
    #mail-reading-preview .mp-lead{margin:18px 0 20px;padding:14px 18px;background:color-mix(in srgb,var(--mp-blue) 6%,var(--mp-paper));border-left:3px solid var(--mp-blue);border-radius:0 9px 9px 0}
    #mail-reading-preview .mp-lead strong{font-weight:500;color:var(--mp-blue)}
    #mail-reading-preview .mp-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:20px 0}
    #mail-reading-preview .mp-setting{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mp-muted)}
    #mail-reading-preview select,#mail-reading-preview button{font:inherit;font-size:13px;color:var(--mp-ink);background:var(--mp-paper);border:1px solid var(--mp-line);border-radius:8px;min-height:38px;padding:7px 10px}
    #mail-reading-preview button{margin-left:auto}
    #mail-reading-preview select:focus-visible,#mail-reading-preview button:focus-visible,#mail-reading-preview summary:focus-visible,#mail-reading-preview a:focus-visible{outline:2px solid var(--mp-blue);outline-offset:3px}
    #mail-reading-preview .mp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}
    #mail-reading-preview .mp-stat{--mp-tone:var(--mp-blue);display:flex;flex-direction:column;gap:3px;padding:14px 18px;background:color-mix(in srgb,var(--mp-tone) 7%,var(--mp-paper));border-radius:11px}
    #mail-reading-preview .mp-stat:nth-child(2){--mp-tone:var(--mp-purple)}
    #mail-reading-preview .mp-stat:nth-child(3){--mp-tone:var(--mp-teal)}
    #mail-reading-preview .mp-stat-label{font-size:13px;color:var(--mp-tone)}
    #mail-reading-preview .mp-stat-number{font-size:28px;line-height:1.4;color:var(--mp-tone);font-weight:500}
    #mail-reading-preview .mp-stat-number small{font-size:13px;font-weight:400;margin-left:5px}
    #mail-reading-preview .mp-nav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
    #mail-reading-preview .mp-nav a{--mp-tone:var(--mp-blue);text-decoration:none;color:var(--mp-tone);background:color-mix(in srgb,var(--mp-tone) 8%,var(--mp-paper));padding:7px 11px;border-radius:9px;font-size:14px;white-space:nowrap}
    #mail-reading-preview .mp-nav a:nth-child(2){--mp-tone:var(--mp-purple)}
    #mail-reading-preview .mp-nav a:nth-child(3){--mp-tone:var(--mp-teal)}
    #mail-reading-preview .mp-section{margin-top:var(--mp-gap);padding-top:var(--mp-gap);border-top:1px solid var(--mp-line)}
    #mail-reading-preview .mp-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
    #mail-reading-preview .mp-section-title>span{font-size:13px;color:var(--mp-muted)}
    #mail-reading-preview .mp-section[data-section="action"] h2{color:var(--mp-blue)}
    #mail-reading-preview .mp-section[data-section="optional"] h2{color:var(--mp-purple)}
    #mail-reading-preview .mp-section[data-section="interests"] h2{color:var(--mp-teal)}
    #mail-reading-preview .mp-section-icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:color-mix(in srgb,currentColor 8%,var(--mp-paper));font-size:20px}
    #mail-reading-preview .mp-action{padding:17px 0}
    #mail-reading-preview .mp-action+.mp-action{border-top:1px solid var(--mp-line)}
    #mail-reading-preview .mp-action-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
    #mail-reading-preview .mp-priority{font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;background:color-mix(in srgb,var(--mp-red) 9%,var(--mp-paper));color:var(--mp-red)}
    #mail-reading-preview .mp-action p{margin:7px 0}
    #mail-reading-preview .mp-source{font-size:13px;color:var(--mp-muted);margin:8px 0}
    #mail-reading-preview .mp-mini{margin:10px 0 0;font-size:14px}
    #mail-reading-preview .mp-mini>summary{color:var(--mp-blue);min-height:32px;padding:4px 0}
    #mail-reading-preview .mp-mini[open]>summary{margin-bottom:6px}
    #mail-reading-preview .mp-detail-body{border-left:2px solid var(--mp-line);padding:2px 0 2px 14px}
    #mail-reading-preview .mp-detail-body ul{padding-left:20px;margin:7px 0}
    #mail-reading-preview .mp-detail-body li{margin:4px 0}
    #mail-reading-preview .mp-optional{padding:14px 16px;border-radius:10px;background:color-mix(in srgb,var(--mp-purple) 5%,var(--mp-paper));margin-top:12px}
    #mail-reading-preview .mp-optional p{margin-top:6px}
    #mail-reading-preview .mp-interests-intro{font-size:14px;color:var(--mp-muted);margin:0 0 15px}
    #mail-reading-preview .mp-interest{--mp-tone:var(--mp-blue);border:1px solid color-mix(in srgb,var(--mp-tone) 22%,var(--mp-line));border-radius:12px;margin:12px 0;overflow:clip}
    #mail-reading-preview .mp-interest[data-topic="investing"]{--mp-tone:var(--mp-purple)}
    #mail-reading-preview .mp-interest[data-topic="property"]{--mp-tone:var(--mp-teal)}
    #mail-reading-preview .mp-interest[data-topic="technology"]{--mp-tone:light-dark(#196e96,#8cd4f4)}
    #mail-reading-preview .mp-interest[data-topic="games"]{--mp-tone:var(--mp-gold)}
    #mail-reading-preview .mp-interest>summary{display:flex;align-items:flex-start;gap:12px;list-style:none;padding:15px 17px;background:color-mix(in srgb,var(--mp-tone) 6%,var(--mp-paper))}
    #mail-reading-preview .mp-interest>summary::-webkit-details-marker{display:none}
    #mail-reading-preview .mp-interest-icon{font-size:20px;flex:0 0 26px;line-height:1.5}
    #mail-reading-preview .mp-interest-heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;color:var(--mp-tone);font-weight:500}
    #mail-reading-preview .mp-interest-count{font-size:13px;color:var(--mp-muted);font-weight:400}
    #mail-reading-preview .mp-interest-preview{display:block;font-size:14px;color:var(--mp-muted);margin-top:3px}
    #mail-reading-preview .mp-interest-label{flex:1;min-width:0}
    #mail-reading-preview .mp-interest-indicator{color:var(--mp-tone);font-size:21px;flex:0 0 15px;text-align:center}
    #mail-reading-preview .mp-interest-indicator::before{content:"+"}
    #mail-reading-preview .mp-interest[open] .mp-interest-indicator::before{content:"−"}
    #mail-reading-preview .mp-interest-body{padding:0 20px}
    #mail-reading-preview .mp-topic{padding:20px 0}
    #mail-reading-preview .mp-topic+.mp-topic{border-top:1px solid var(--mp-line)}
    #mail-reading-preview .mp-topic h3{color:var(--mp-tone)}
    #mail-reading-preview .mp-topic p{margin:8px 0}
    #mail-reading-preview .mp-topic ul{padding-left:21px;margin:8px 0}
    #mail-reading-preview .mp-topic li{margin:5px 0}
    #mail-reading-preview .mp-topic .mp-mini>summary{color:var(--mp-muted)}
    #mail-reading-preview .mp-private{margin-top:24px;border-top:1px solid var(--mp-line);padding-top:18px;font-size:14px;color:var(--mp-muted)}
    #mail-reading-preview .mp-private summary{color:var(--mp-gold);min-height:38px;padding:6px 0}
    #mail-reading-preview .mp-footer{font-size:12px;color:var(--mp-muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:25px;padding-top:16px;border-top:1px solid var(--mp-line)}
    #mail-reading-preview .mp-accessible{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    @media(max-width:520px){#mail-reading-preview{padding:22px 16px 26px}#mail-reading-preview .mp-topline{padding-right:70px}#mail-reading-preview h1{font-size:calc(var(--mp-font)*1.35)}#mail-reading-preview .mp-stats{gap:8px}#mail-reading-preview .mp-stat{padding:12px 11px}#mail-reading-preview .mp-stat-number{font-size:26px}#mail-reading-preview .mp-nav{gap:7px}#mail-reading-preview .mp-nav a{padding:7px 9px}#mail-reading-preview .mp-interest>summary{padding:13px 12px;gap:8px}#mail-reading-preview .mp-interest-body{padding:0 14px}#mail-reading-preview button,#mail-reading-preview select{min-height:44px}#mail-reading-preview .mp-toolbar{gap:8px}#mail-reading-preview .mp-setting{gap:5px}}
    @media(prefers-reduced-motion:reduce){#mail-reading-preview{scroll-behavior:auto}}
  
#mail-reading-preview .mp-editorial p{white-space:pre-wrap;margin:9px 0}#mail-reading-preview .mp-editorial h3{margin-top:16px}#mail-reading-preview .mp-topic p{white-space:pre-wrap}#mail-reading-preview .mp-interest[data-topic="other"]{--mp-tone:var(--mp-muted)}
</style><!--REPORT_BODY--><script data-reading-controls>
    (() => {
      'use strict';
      const root = document.getElementById('mail-reading-preview');
      const font = root.querySelector('[data-control="font"]');
      const theme = root.querySelector('[data-control="theme"]');
      const expand = root.querySelector('[data-control="expand"]');
      const notice = root.querySelector('[data-control="notice"]');
      const details = [...root.querySelectorAll('[data-detail]')];
      const settings = {font:18,theme:'system',gap:24,radius:16};
      let restoring = false;
      const apply = () => {
        root.style.setProperty('--mp-font', settings.font + 'px');
        root.style.setProperty('--mp-gap', settings.gap + 'px');
        root.style.setProperty('--mp-radius', settings.radius + 'px');
        if (settings.theme === 'system') root.style.removeProperty('color-scheme');
        else root.style.colorScheme = settings.theme;
        font.value = String(settings.font);
        theme.value = settings.theme;
      };
      const syncExpand = () => {
        const all = details.every(item => item.open);
        expand.setAttribute('aria-pressed', String(all));
        expand.textContent = all ? '收起全部' : '展开全部';
      };
      const save = () => {
        if (restoring) return;
        try { localStorage.setItem('mail-agent-reading-settings',JSON.stringify({font:settings.font,theme:settings.theme,gap:settings.gap,radius:settings.radius,open:details.filter(item=>item.open).map(item=>item.dataset.detail)})); } catch (_) {}
      };
      const restore = payload => {
        const value = payload?.privateContent || payload;
        if (!value || typeof value !== 'object') return;
        restoring = true;
        if ([16,18,20].includes(Number(value.font))) settings.font = Number(value.font);
        if (['system','light','dark'].includes(value.theme)) settings.theme = value.theme;
        if (Number.isFinite(value.gap) && value.gap >= 16 && value.gap <= 32) settings.gap = value.gap;
        if (Number.isFinite(value.radius) && value.radius >= 0 && value.radius <= 24) settings.radius = value.radius;
        if (Array.isArray(value.open)) details.forEach(item=>{item.open=value.open.includes(item.dataset.detail);});
        apply(); syncExpand(); restoring = false;
      };
      apply();
      try { restore(JSON.parse(localStorage.getItem('mail-agent-reading-settings'))); } catch (_) {}
      font.addEventListener('change',()=>{settings.font=Number(font.value);apply();notice.textContent='字号已调整';save();});
      theme.addEventListener('change',()=>{settings.theme=theme.value;apply();notice.textContent='外观已调整';save();});
      expand.addEventListener('click',()=>{const opening=!details.every(item=>item.open);details.forEach(item=>{item.open=opening;});syncExpand();notice.textContent=opening?'全部摘要已展开':'全部摘要已收起';save();});
      details.forEach(item=>{
        item.addEventListener('toggle',syncExpand);
        item.querySelector('summary').addEventListener('click',()=>{setTimeout(save,0);});
      });
      root.querySelectorAll('button,select,summary,a').forEach(item=>item.classList.add('cursor-interaction'));
    })();
  </script></div></main></body></html>
