<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="<!--CONTENT_POLICY-->">
<title>邮件简报 · 紧凑速览版</title>
<style>
:root{color-scheme:light dark;--bg:#eef4f3;--paper:#fff;--text:#203a3c;--muted:#577075;--line:#d8e6e3;--accent:#087f78;--soft:#e7f6f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:980px;margin:24px auto 60px;background:var(--paper);padding:28px 36px;border:1px solid var(--line);border-radius:18px}header{border-left:5px solid var(--accent);padding-left:18px}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:750}.eyebrow span{float:right;letter-spacing:0}h1{font-size:30px;line-height:1.2;margin:12px 0 6px}p{margin:8px 0;overflow-wrap:anywhere}.dateline,.source,.hint{color:var(--muted)}.dateline,.source{font-size:12px}.sample{font-size:13px;background:var(--soft);padding:7px 10px;border-radius:6px}.metrics{display:flex;gap:28px;margin:24px 0 12px;border-bottom:1px solid var(--line);padding-bottom:18px}.metrics>div{display:flex;align-items:baseline;gap:8px}.metrics strong{font-size:28px;color:var(--accent);line-height:1}.metrics span,.hint{font-size:13px}section{margin-top:26px}h2{font-size:16px;margin:0 0 8px;display:flex;gap:8px;align-items:center}h2 small{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}.message{border-bottom:1px solid var(--line)}summary{cursor:pointer}summary::marker{color:var(--accent)}.message>summary{padding:12px 4px;display:list-item}.subject{font-size:15px;font-weight:650;overflow-wrap:anywhere}.tags{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:10px}.badge{font-size:11px;padding:1px 7px;border-radius:5px;white-space:nowrap}.high{background:#ffe4df;color:#a32a20}.medium{background:#fff1c8;color:#855c0d}.low{background:var(--soft);color:var(--accent)}.reply{background:#e6eaff;color:#434c9b}.category{font-size:11px;color:var(--muted)}.message-body{padding:0 6px 12px 18px}.summary{font-size:15px;white-space:pre-wrap}.deadline{font-size:13px;font-weight:650}.appendix{margin-top:28px;padding:14px;background:var(--soft);border-radius:8px}.appendix summary{font-size:14px;font-weight:650}.editorial{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin-top:12px}aside{margin-top:26px;color:var(--muted);font-size:12px}aside h2{font-size:13px}footer{border-top:1px solid var(--line);margin-top:22px;padding-top:12px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:12px}.empty{padding:20px;background:var(--soft)}
@media(prefers-color-scheme:dark){:root{--bg:#111e20;--paper:#18292b;--text:#e1efec;--muted:#9db5b3;--line:#30484a;--accent:#62d8c8;--soft:#223e3c}.high{background:#66352f;color:#ffc9c1}.medium{background:#5c481d;color:#f6df9b}.reply{background:#343958;color:#d6d9ff}}
@media(max-width:600px){main{margin:0;padding:24px 18px 36px;border:0;border-radius:0}.metrics{gap:18px}.metrics>div{display:block;flex:1}.metrics span{display:block;font-size:11px;margin-top:6px}.tags{display:flex;margin:5px 0 0}.eyebrow span{float:none;display:block;margin-top:4px}footer{display:block}footer span{display:block;margin-top:4px}}
@media print{:root{--bg:#fff;--paper:#fff;--text:#111;--muted:#444;--line:#ccc;--accent:#155c55;--soft:#f5f5f5}main{border:0;margin:0;padding:0;max-width:none}.message{break-inside:avoid}body{font-size:11pt}.hint:after{content:' 打印完整展开内容请使用正式打印版。'}footer{margin-top:12px}}
</style></head><body><main data-template="compact"><!--REPORT_BODY--></main></body></html>
