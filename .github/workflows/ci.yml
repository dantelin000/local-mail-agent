name: Tests and private-data audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,telegram]'
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/normalize_archives.py dist/*.tar.gz
      - run: python scripts/audit_release.py --history dist/*.whl dist/*.tar.gz
